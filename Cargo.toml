[package]
name = "yatt"
version = "0.4.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.105"
async-channel = "2.5.0"
dirs = "7.0.0"
env_logger = "0.11.12"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
gpui = "0.2.2"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.3"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

# Compile Metal shaders at runtime so building needs only the Command Line Tools, not Xcode.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[profile.release]
lto = "thin"
codegen-units = 4

[patch.crates-io]
# xattr 0.2.3 (pulled in by gpui's http client) references libc::ENOATTR, which newer libc
# releases no longer export on Linux. ENODATA is the Linux value it aliased.
xattr = { path = "vendor/xattr" }
