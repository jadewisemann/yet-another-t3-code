name: Go server

on:
  push:
    branches: [main]
    paths: [server/**, spec/**, conformance/**, tools/spec-extract/**, scripts/spec-update.sh, scripts/conformance.sh, .github/workflows/go-server.yml]
  pull_request:
    paths: [server/**, spec/**, conformance/**, tools/spec-extract/**, scripts/spec-update.sh, scripts/conformance.sh, .github/workflows/go-server.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - working-directory: server
        run: |
          go vet ./...
          go test ./...
          go run ./cmd/speccov -check

  # The spec in the repository must be exactly what the extractor produces
  # for the pinned upstream version.
  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Extract the spec again and compare
        run: |
          version="$(cat spec/upstream-version)"
          git clone --quiet --depth 1 --branch "v$version" https://github.com/pingdotgg/t3code.git "$RUNNER_TEMP/upstream"
          cd tools/spec-extract
          bun install --frozen-lockfile
          bun extract.ts "$RUNNER_TEMP/upstream" ../../spec/generated
          git diff --stat --exit-code -- ../../spec/generated

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upstream still matches the golden transcripts
        run: scripts/conformance.sh upstream
      - name: yatt-server against the golden transcripts
        run: scripts/conformance.sh go
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: .cache/conformance-report.json
          if-no-files-found: ignore
