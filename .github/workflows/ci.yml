name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev libxcb-xkb-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Bundle YATT.app
        run: |
          scripts/bundle-macos.sh target/release
      - name: Start the bundled T3 Code server and pair with it
        run: |
          codesign --verify --deep --strict target/release/YATT.app
          target/release/YATT.app/Contents/Resources/t3/t3 --version
          T3CODE_HOME="$RUNNER_TEMP/t3home" YATT_CONFIG_DIR="$RUNNER_TEMP/yatt" \
            target/release/YATT.app/Contents/MacOS/yatt pair || { cat "$RUNNER_TEMP/yatt/server.log"; exit 1; }
      - name: Zip YATT.app
        run: |
          cd target/release && ditto -c -k --keepParent YATT.app YATT-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YATT-macos-arm64
          path: target/release/YATT-macos-arm64.zip
