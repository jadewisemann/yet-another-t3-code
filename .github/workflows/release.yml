name: Release

# Publishes a release whenever main carries a Cargo.toml version that has no release yet,
# then points the Homebrew cask in this repo at it. Bump `version` in Cargo.toml to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false'
      - name: Build YAT3.app
        if: steps.version.outputs.exists == 'false'
        run: |
          cargo build --release --locked
          scripts/bundle-macos.sh target/release
          cd target/release && ditto -c -k --keepParent YAT3.app YAT3-macos-arm64.zip
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" target/release/YAT3-macos-arm64.zip \
            --target "$GITHUB_SHA" --title "YAT3 $VERSION" --generate-notes
      - name: Update Homebrew cask
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha="$(shasum -a 256 target/release/YAT3-macos-arm64.zip | cut -d' ' -f1)"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" Casks/yat3.rb
          sed -i '' -E "s/^  sha256 .*/  sha256 \"$sha\"/" Casks/yat3.rb
          if git diff --quiet Casks/yat3.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/yat3.rb
          git commit -m "Update cask to $VERSION [skip ci]"
          git push origin HEAD:main
